<body>

<header class="nav" id="nav">
  <a href="#inicio" class="logo" aria-label="Dos Anillos, inicio"><span class="logo-img"></span></a>

  </nav>
  <a class="cart-btn wa" target="_blank" rel="noopener">WhatsApp</a>
  <button class="menu-btn" id="menuBtn" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu"><i></i><i></i><i></i></button>
  <p class="side-foot">Del alma al sonido<br>© 2026 Dos Anillos</p>
</header>
<button class="side-toggle" id="sideToggle" aria-label="Ocultar menú" aria-expanded="true" aria-controls="nav"><i></i></button>

<main id="main">

<!-- HERO -->
<section class="hero" id="inicio">
  <img class="hero-video" id="heroImg" alt="Flautas pentatónicas de madera Dos Anillos" fetchpriority="high">
  <div class="hero-shade"></div>
  <div class="hero-content">
    <p class="eyebrow" data-t="hero.eyebrow"></p>
    <h1><span data-t="hero.title"></span><br><em data-t="hero.titleEm"></em></h1>
    <p class="lead" data-t="hero.lead"></p>
    <a class="btn" href="#flautas" data-t="hero.button"></a>
  </div>
</section>

<!-- FLAUTAS -->
<section class="section" id="flautas">
  <div class="section-head">
    <p class="eyebrow" data-t="flautas.eyebrow"></p>
    <h2 data-t="flautas.title"></h2>
  </div>
  <div id="products"></div>
</section>

<!-- MADERAS -->
<section class="section alt" id="maderas">
  <div class="section-head">
    <p class="eyebrow" data-t="maderas.eyebrow"></p>
    <h2 data-t="maderas.title"></h2>
  </div>
  <div class="woods" id="woods"></div>
</section>

<!-- CUIDADO -->
<section class="section" id="cuidado">
  <div class="section-head">
    <p class="eyebrow" data-t="cuidado.eyebrow"></p>
    <h2 data-t="cuidado.title"></h2>
    <p class="muted" data-md="cuidado.intro"></p>
  </div>
  <ol class="care" id="care"></ol>
</section>

<!-- HISTORIA Y MISIÓN -->
<section class="section" id="historia">
  <div class="section-head">
    <p class="eyebrow" data-t="historia.eyebrow"></p>
    <h2 data-t="historia.title"></h2>
  </div>
  <div class="story" id="story"></div>
</section>

<!-- ENVÍOS -->
<section class="section alt" id="envios">
  <div class="section-head">
    <p class="eyebrow" data-t="envios.eyebrow"></p>
    <h2 data-t="envios.title"></h2>
    <p class="muted" data-md="envios.intro"></p>
  </div>
</section>

<!-- QUIÉNES SOMOS -->
<section class="section" id="quienes-somos">
  <div class="section-head">
    <p class="eyebrow" data-t="equipo.eyebrow"></p>
    <h2 data-t="equipo.title"></h2>
  </div>
  <div class="team">
    <figure class="workshop"><img loading="lazy" id="teamImg" alt="Taller Dos Anillos"><figcaption data-t="equipo.caption"></figcaption></figure>
    <div>
      <h3 class="team-title" data-t="equipo.teamTitle"></h3>
      <ul class="makers" id="makers"></ul>
    </div>
  </div>
</section>

<!-- CONTACTO -->
<section class="section alt contact" id="contacto">
  <p class="eyebrow" data-t="contacto.eyebrow"></p>
  <h2 data-t="contacto.title"></h2>
  <p class="muted" data-md="contacto.intro"></p>
  <a class="btn wa" target="_blank" rel="noopener" data-t="contacto.button"></a>
  <p class="phone" data-t="general.phone"></p>
</section>

<!-- SUGERENCIAS Y RECLAMOS -->
<section class="section" id="sugerencias">
  <div class="section-head">
    <p class="eyebrow" data-t="sugerencias.eyebrow"></p>
    <h2 data-t="sugerencias.title"></h2>
    <p class="muted" data-md="sugerencias.intro"></p>
  </div>
  <form class="feedback" id="feedback" method="POST">
    <label>Tipo
      <select name="Tipo" required>
        <option>Sugerencia</option>
        <option>Reclamo</option>
      </select>
    </label>
    <label>Nombre<input name="Nombre" required autocomplete="name"></label>
    <label>Correo<input name="email" type="email" required autocomplete="email"></label>
    <label class="wide">Mensaje<textarea name="Mensaje" rows="5" required></textarea></label>
    <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button class="btn" type="submit">Enviar</button>
  </form>
</section>

<footer class="footer">
  <p>Página desarrollada por <a href="https://benedettowebs.vercel.app/" target="_blank" rel="noopener">BenedettoWebs</a></p>
</footer>

</main>

<div class="toast" id="toast" role="status"></div>

<script src="content.js"></script>
<script src="app.js"></script>
